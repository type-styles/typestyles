name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm turbo run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build typestyles
        run: pnpm --filter typestyles build

      - name: Run benchmarks
        run: pnpm --filter @typestyles/benchmarks bench:ci

  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # Do not set registry-url on setup-node: it writes a placeholder _authToken
      # line that blocks npm Trusted Publishing (OIDC). Registry is in .npmrc.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'
          package-manager-cache: false

      # Trusted Publishing needs npm >= 11.5.1. Do not use npm@latest: npm 12 rejects
      # --git-checks, which pnpm forwards when changeset publish runs pnpm publish.
      - name: Use npm compatible with pnpm publish
        run: npm install -g 'npm@^11.5.1'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm run version
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-unstable:
    name: Release unstable packages
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.event.head_commit.message != 'chore: version packages'
    needs: [lint, typecheck, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # Do not set registry-url on setup-node: it writes a placeholder _authToken
      # line that blocks npm Trusted Publishing (OIDC). Registry is in .npmrc.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'pnpm'
          package-manager-cache: false

      # Trusted Publishing needs npm >= 11.5.1. Do not use npm@latest: npm 12 rejects
      # --git-checks forwarded by pnpm publish --no-git-checks.
      - name: Use npm compatible with pnpm publish
        run: npm install -g 'npm@^11.5.1'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build

      - name: Set unstable commit versions
        run: node scripts/set-unstable-versions.js
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Publish all workspace packages with unstable tag
        run: pnpm -r --filter "./packages/*" publish --tag unstable --access public --no-git-checks
